name: Deploy to GitHub Pages

on:
  # Every push to main publishes the site. Using another branch name? Change it here.
  push:
    branches: [main]
  # Allows running the workflow manually from the Actions tab.
  workflow_dispatch:

# Allow this workflow to read the repository and create a Pages deployment.
permissions:
  contents: read
  pages: write
  id-token: write

# One deployment at a time; never cancel one that is already running.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      # Detects npm from package-lock.json, uses Node 24, runs `npm run build`
      # and uploads dist/ as the Pages artifact.
      - name: Install, build and upload the site
        uses: withastro/action@v6

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
